defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /posts/:title/
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-archives

url: "https://sandstormnick.github.io/"
baseurl: "/Blog"

exclude:
  - docker-compose.yml
  - assets/images/attribution.txt
  - "Future Learning/" 

sass:
  quiet_deps: true
  # The Bootstrap load path is added by the GitHub Actions workflow (.github/workflows/jekyll.yml)

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: '/categories/:name/'
    tag: '/tags/:name/'